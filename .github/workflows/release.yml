name: Windows Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the CMake version (for example, v0.12)"
        required: true
        default: "v0.12"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-release:
    name: Build, test, and publish Windows ZIP
    # windows-latest moved to Visual Studio 2026; this project currently targets the VS 2022 generator.
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag and project version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $cmakeText = Get-Content "CMakeLists.txt" -Raw
          $versionMatch = [regex]::Match($cmakeText, 'project\(RocketVolley VERSION (\d+\.\d+(?:\.\d+)?)')
          if (-not $versionMatch.Success) {
            throw "Could not read the Rocket Volley version from CMakeLists.txt."
          }

          $projectVersion = $versionMatch.Groups[1].Value
          $releaseTag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $env:REQUESTED_TAG
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "v$projectVersion"
          }

          if ($releaseTag -ne "v$projectVersion") {
            throw "Release tag $releaseTag does not match CMake version v$projectVersion."
          }

          "PROJECT_VERSION=$projectVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Release build
        run: cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build Release executable
        run: cmake --build build-release --config Release --parallel 4

      - name: Run headless gameplay, physics, and protocol regressions
        # None of these tests opens a window/audio device or needs an OpenGL context.
        run: ctest --test-dir build-release -C Release -L headless --output-on-failure

      - name: Create portable Windows package
        run: cpack --config build-release/CPackConfig.cmake -C Release -G ZIP

      - name: Verify package contents and tested executable
        shell: pwsh
        run: ./tools/VerifyPackage.ps1 -Archive "RocketVolley-$env:PROJECT_VERSION-windows-x64.zip" -Executable "build-release/Release/RocketVolley.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketVolley-windows-x64
          path: |
            RocketVolley-${{ env.PROJECT_VERSION }}-windows-x64.zip
            RocketVolley-${{ env.PROJECT_VERSION }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "RocketVolley-$env:PROJECT_VERSION-windows-x64.zip"
          $checksum = "$zip.sha256"
          $intro = "Download the Windows ZIP below, extract it, and run RocketVolley.exe. No installer is required."
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json

          if ($releases.tagName -contains $env:RELEASE_TAG) {
            gh release upload $env:RELEASE_TAG $zip $checksum --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG $zip $checksum `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Rocket Volley $env:RELEASE_TAG" `
              --notes $intro `
              --generate-notes `
              --latest
          }
